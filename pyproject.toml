[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "authz-delta"
version = "0.1.0"
description = "Deterministic authorization-reachability delta analysis for a bounded GitHub OIDC to EKS RBAC path."
requires-python = ">=3.10"
dependencies = [
  "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
authz-delta = "authz_delta.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
strict = true
python_version = "3.10"
